spring.application.name=brasa-pdv
server.port=8080

# banco (postgres no docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/brasapdv
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# login
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# chave da IA fica no segredos.properties
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-5-5
spring.config.import=optional:file:./segredos.properties

# dados de teste
app.dados-exemplo=true